set -g mouse on

set -g status-right-length 110
set -g status-right '#[fg=green]%Y-%m-%d %H:%M '

bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

set-option -g default-shell /bin/zsh

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set-option -g status-position bottom

# worktree picker popup (prefix + g)
bind g display-popup -E -w 80% -h 70% -d "#{pane_current_path}" 'export PATH="/opt/homebrew/bin:$HOME/.config/scripts:$PATH"; wt || { status=$?; echo "[press enter to close]"; read -r _; exit $status; }'

# List of plugins
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# colors gruvbox
set -g @dracula-colors "
white='#EBDBB2'
gray='#32302F'
dark_gray='#282828'
light_purple='#B16286'
dark_purple='#504945'
cyan='#689D6A'
green='#98971A'
orange='#D65D0E'
red='#CC241D'
pink='#D3869B'
yellow='#D79921'
# === colors ===
# --- muted  ---
muted_back="#282828"
muted_red="#CC241D"
muted_green="#98971A"
muted_yellow="#D79921"
muted_blue="#458588"
muted_purple="#B16286"
muted_aqua="#689D6A"
muted_orange="#D65D0E"
muted_fore="#A89984"
# --- strong ---
strong_back="#928374"
strong_red="#FB4934"
strong_green="#B8BB26"
strong_yellow="#FABD2F"
strong_blue="#83A598"
strong_purple="#D3869B"
strong_aqua="#8EC07C"
strong_orange="#FE8019"
strong_fore="#EBDBB2"
# === backgrounds ===
back_0_hard="#1D2021"
back_0_soft="#32302F"
back_1="#3C3836"
back_2="#504945"
back_3="#665C54"
back_4="#7C6F64"
